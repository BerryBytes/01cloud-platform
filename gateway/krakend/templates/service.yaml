apiVersion: v1
kind: Service
metadata:
  name: {{ include "krakend.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 8080 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
      name: http
    - port: 9091
      targetPort: 9091
      name: metric
  selector:
    app: {{ .Values.selector.app | default "krakend" }}
