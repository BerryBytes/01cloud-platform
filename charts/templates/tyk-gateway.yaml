apiVersion: v1
items:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: tyk-conf
    namespace: 01cloud-staging
  data:
    tyk.conf: |
      {
        "log_level": "info" ,
        "listen_port": 8080,
        "secret": "352d20ee67be67f6340b4c0605b044b7",
        "template_path": "/opt/tyk-gateway/templates",
        "tyk_js_path": "/opt/tyk-gateway/js/tyk.js",
        "middleware_path": "/opt/tyk-gateway/middleware",
        "use_db_app_configs": false,
        "app_path": "/opt/tyk-gateway/apps/",
        "storage": {
          "type": "redis",
          "host": "tyk-redis",
          "port": 6379,
          "username": "",
          "password": "",
          "database": 0,
          "optimisation_max_idle": 2000,
          "optimisation_max_active": 4000,
          "enable_cluster": false
        },
        "enable_analytics": false,
        "analytics_config": {
          "type": "",
          "ignored_ips": []
        },
        "health_check": {
          "enable_health_checks": false,
          "health_check_value_timeouts": 60
        },
        "enable_non_transactional_rate_limiter": true,
        "enable_sentinel_rate_limiter": false,
        "enable_redis_rolling_limiter": false,
        "allow_master_keys": false,
        "policies": {
          "policy_source": "file",
          "policy_path": "/opt/tyk-gateway/policies"
        },
        "hash_keys": true,
        "close_connections": false,
        "http_server_options": {
          "enable_websockets": true
        },
        "allow_insecure_configs": true,
        "security": {
          "force_ssl": false,
          "skip_ssl_verify": true
        },
        "coprocess_options": {
          "enable_coprocess": true,
          "coprocess_grpc_server": ""
        },
        "enable_bundle_downloader": true,
        "bundle_base_url": "",
        "global_session_lifetime": 100,
        "force_global_session_lifetime": false,
        "max_idle_connections_per_host": 500,
        "enable_jsvm": true
      }
    test-ws-api.json: |
      {
        "name": "Test WebSocket API",
        "slug": "test-ws-api",
        "api_id": "2",
        "org_id": "1",
        "use_keyless": true,
        "version_data": {
          "not_versioned": true,
          "versions": {
            "Default": {
              "name": "Default",
              "use_extended_paths": true
            }
          }
        },
        "proxy": {
          "listen_path": "/ws",
          "strip_listen_path": true,
          "target_url": "wss://api.staging.01cloud.dev/ws",
          "connection_type": "websocket",
          "transport": {
            "ssl_insecure_skip_verify": true
          }
        },
        "active": true
      }
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: tyk-gateway
    namespace: 01cloud-staging
    labels:
      app: tyk-gateway
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: tyk-gateway
    template:
      metadata:
        labels:
          app: tyk-gateway
      spec:
        containers:
        - name: tyk-gateway
          image: docker.tyk.io/tyk-gateway/tyk-gateway:latest
          ports:
          - containerPort: 8080
          volumeMounts:
          - name: tyk-conf
            mountPath: /opt/tyk-gateway/tyk.conf
            subPath: tyk.conf
          - name: tyk-conf
            mountPath: /opt/tyk-gateway/apps/test-ws-api.json
            subPath: test-ws-api.json
          env:
          - name: TYK_GW_STORAGE_HOST
            value: "tyk-redis"
          - name: TYK_GW_STORAGE_PORT
            value: "6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
        volumes:
        - name: tyk-conf
          configMap:
            name: tyk-conf
- apiVersion: v1
  kind: Service
  metadata:
    name: tyk-gateway
    namespace: 01cloud-staging
    labels:
      app: tyk-gateway
  spec:
    ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    selector:
      app: tyk-gateway
    type: ClusterIP
- apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    name: tyk-redis
    namespace: 01cloud-staging
    labels:
      app: tyk-redis
  spec:
    replicas: 1
    serviceName: tyk-redis
    selector:
      matchLabels:
        app: tyk-redis
    template:
      metadata:
        labels:
          app: tyk-redis
      spec:
        containers:
        - name: redis
          image: redis:4.0-alpine
          ports:
          - containerPort: 6379
          volumeMounts:
          - name: redis-data
            mountPath: /data
          resources:
            requests:
              memory: "25Mi"
              cpu: "25m"
            limits:
              memory: "51Mi"
              cpu: "50m"
    volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
- apiVersion: v1
  kind: Service
  metadata:
    name: tyk-redis
    namespace: 01cloud-staging
    labels:
      app: tyk-redis
  spec:
    ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
    selector:
      app: tyk-redis
    type: ClusterIP
kind: List
metadata:
  resourceVersion: ""
