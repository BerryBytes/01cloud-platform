apiVersion: v1
items:
- apiVersion: v1
  data:
    API_SECRET: {{ .Values.secret.API_SECRET | quote }}
    DB_PASSWORD: {{ .Values.secret.DB_PASSWORD | quote }}
    DB_URL: {{ .Values.secret.DB_URL | quote }}
    MONGO_URL: {{ .Values.secret.MONGO_URL | quote }}
    RABBITMQ_URL: {{ .Values.secret.RABBITMQ_URL | quote }}
    RABBITMQ_PASSWORD: {{ .Values.secret.RABBITMQ_PASSWORD | quote }}
    SMTP_PASSWORD: {{ .Values.secret.SMTP_PASSWORD | quote }}
    MODE: {{ .Values.secret.MODE | quote }}
  kind: Secret
  metadata:
    name: env-secrets
  type: Opaque
- apiVersion: v1
  data:
    tls.crt: {{ .Values.secret.TLS_CRT | quote }}
    tls.key: {{ .Values.secret.TLS_KEY | quote }}
  kind: Secret
  metadata:
    name: zerone-tls-cert
  type: kubernetes.io/tls
- apiVersion: gateway.networking.k8s.io/v1beta1
  kind: ReferenceGrant
  metadata:
    name: staging-cert-reference
    namespace: 01cloud-staging
  spec:
    from:
      - group: gateway.networking.k8s.io
        kind: Gateway
        namespace: envoy-gateway-system
    to:
      - group: ""
        kind: Secret
        name: zerone-tls-cert
kind: List
metadata:
  resourceVersion: ""
