        - name: DB_DRIVER
          value: {{.Values.env.DB_DRIVER}}
        - name: DB_USER
          value: {{.Values.env.DB_USER}}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: env-secrets
        - name: DB_NAME
          value: {{.Values.env.DB_NAME}}
        - name: DB_PORT
          value: {{.Values.env.DB_PORT | quote }}
        - name: API_SECRET
          valueFrom:
            secretKeyRef:
              key: API_SECRET
              name: env-secrets
        - name: PROMETHEUS_API_URL
          value: {{.Values.env.PROMETHEUS_API_URL}}
        - name: PORT
          value: "8081"
        - name: TERMINAL_URL
          value: {{.Values.env.terminalUrl}}
        - name: API_SERVER_URL
          value: {{.Values.env.API_SERVER_URL}}
        - name: ALERT_MANAGER_URL
          value: {{.Values.env.alertManagerHost}}
        - name: ALERT_MANAGER_USER
          value: {{.Values.env.alertManagerUser}}
