apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: 01cloud-terminal
  name: 01cloud-terminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 01cloud-terminal
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: 01cloud-terminal
    spec:
      serviceAccount: staging-sa
      serviceAccountName: staging-sa
      containers:
      - env:
        - name: MONITOR_URL
          value: {{.Values.env.API_SERVER_URL}}/monitoring/token
        image: zeronecloud/webshell:v1.0.2
        imagePullPolicy: IfNotPresent
        name: 01cloud-terminal
        ports:
        - containerPort: 8080
          name: 01cloud
          protocol: TCP
        volumeMounts:
        - mountPath: /data
          name: 01cloud-data
      restartPolicy: Always
      volumes:
      - name: 01cloud-data
        persistentVolumeClaim:
          claimName: pvc-01cloud-data
