          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8081
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /data
          name: 01cloud-data
      restartPolicy: Always
      volumes:
      - name: 01cloud-data
        persistentVolumeClaim:
          claimName: pvc-01cloud-data
---

