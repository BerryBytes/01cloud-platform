apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: 01cloud-notifications
  name: 01cloud-notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 01cloud-notifications
  template:
    metadata:
      labels:
        app: 01cloud-notifications
    spec:
      containers:
      - env:
        - name: GCLOUD_PROJECT
          value: {{.Values.env.GCLOUD_PROJECT}}
        - name: GCLOUD_NAMESPACE
          value: {{.Values.env.GCLOUD_NAMESPACE}}
        - name: STORE_TYPE
          value: {{.Values.env.STORE_TYPE}}
        - name: MESSAGE_TYPE
          value: {{.Values.env.MESSAGE_TYPE}}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: {{.Values.env.GOOGLE_APPLICATION_CREDENTIALS}}
        - name: MONGO_URL
          valueFrom:
            secretKeyRef:
              key: MONGO_URL
              name: env-secrets
        - name: MONGO_DB
          value: {{.Values.env.MONGO_DB}}
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              key: RABBITMQ_URL
              name: env-secrets
        - name: GRPC_SERVER_PORT
          value: "10081"
        - name: GRPC_API_SERVER_PORT
          value: "10081"
        - name: WS_SECRET
          valueFrom:
            secretKeyRef:
              key: API_SECRET
              name: env-secrets
        - name: WS_SERVER
          value: {{.Values.env.API_SERVER_WS}}
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              key: DB_URL
              name: env-secrets
        - name: SMTP_FROM_ADDRESS
          value: {{.Values.env.SMTP_FROM_ADDRESS}}
        - name: SMTP_HOST
          value: {{.Values.env.SMTP_HOST}}
        - name: SMTP_PORT
          value: {{.Values.env.SMTP_PORT | quote}}
        - name: SMTP_USERNAME
          value: {{.Values.env.SMTP_USERNAME}}
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SMTP_PASSWORD
              name: env-secrets
        image: {{.Values.image.notification}}
        name: 01cloud-notifications
        volumeMounts:
          - mountPath: /data
            name: 01cloud-data
      volumes:
      - name: 01cloud-data
        persistentVolumeClaim:
          claimName: pvc-01cloud-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: 01cloud-support
  name: 01cloud-support-grpc-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 01cloud-support
  template:
    metadata:
      labels:
        app: 01cloud-support
    spec:
      containers:
      - command:
        - /app/01cloud-support-grpc
        env:
        - name: GRPC_SERVER_PORT
          value: "50051"
        - name: DB_TYPE
          value: postgres
        - name: DB_HOST
          value: {{.Values.env.DB_HOST}}
        - name: DB_USER
          value: {{.Values.env.DB_USER}}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: env-secrets
        - name: DB_NAME
          value: {{.Values.env.DB_NAME}}
        - name: DB_NAME_TEST
          value: support_db_test
        - name: DB_PORT
          value: {{.Values.env.DB_PORT | quote }}
        - name: GRPC_SUPPORT_SERVER
          value: cloud-support:50051
        - name: GRPC_NOTIFICATION_SERVER
          value: {{.Values.env.GRPC_NOTIFICATION_SERVER}}
        - name: SMTP_FROM_ADDRESS
          value: {{.Values.env.SMTP_FROM_ADDRESS}}
        - name: SMTP_HOST
          value: {{.Values.env.SMTP_HOST}}
        - name: SMTP_PORT
          value: {{.Values.env.SMTP_PORT | quote}}
        - name: SMTP_USERNAME
          value: {{.Values.env.SMTP_USERNAME}}
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SMTP_PASSWORD
              name: env-secrets
        image: {{.Values.image.support}}
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 01cloud-grpc
          timeoutSeconds: 1
        name: 01cloud-support-grpc
        ports:
        - containerPort: 50051
          name: 01cloud-grpc
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 01cloud-grpc
          timeoutSeconds: 1
      - command:
        - /app/01cloud-support-http
        env:
        - name: GRPC_SERVER_PORT
          value: "50051"
        - name: HTTP_SERVER_PORT
          value: "5000"
        - name: GRPC_SUPPORT_SERVER
          value: cloud-support:50051
        - name: GRPC_NOTIFICATION_SERVER
          value: {{.Values.env.GRPC_NOTIFICATION_SERVER}}
        - name: ADMIN_ID
          value: {{.Values.env.adminID}}
        image: {{.Values.image.support}}
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 01cloud-http
          timeoutSeconds: 1
        name: 01cloud-support-http
        ports:
        - containerPort: 5000
          name: 01cloud-http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 01cloud-http
          timeoutSeconds: 1
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---

