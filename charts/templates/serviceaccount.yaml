apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: staging-sa
secrets:
- name: staging-sa
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: staging-sa
rules:
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - "*"
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: staging-sa
subjects:
- kind: ServiceAccount
  name: staging-sa
  namespace: {{ .Release.Namespace }}
---

apiVersion: v1
data:
  ca.crt: 
  token: 
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: staging-sa
  name: staging-sa
type: kubernetes.io/service-account-token
