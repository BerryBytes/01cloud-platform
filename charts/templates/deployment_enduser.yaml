    template:
      metadata:
        labels:
          app: 01cloud-ui
      spec:
        containers:
        - image: {{.Values.image.ui }}
          livenessProbe:
            failureThreshold: 3
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: 01cloud-ui
          ports:
          - containerPort: 80
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /usr/share/nginx/html/config.js
            name: config
            subPath: config.js
        dnsPolicy: ClusterFirst
        imagePullSecrets:
        - name: ovh-registry
        restartPolicy: Always
        volumes:
        - configMap:
            defaultMode: 420
            name: config
          name: config
