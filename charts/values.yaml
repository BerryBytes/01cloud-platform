  RABBITMQ_PASSWORD: --- YOUR-RABBITMQ-PASSWORD ---
  TLS_CRT:  --- YOUR-TLS ---
  TLS_KEY:  --- YOUR-KEY ---
  MODE: bGVnYWN5

env:
