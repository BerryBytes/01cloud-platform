# Default values for staging.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:

  ui: 01community/01cloud:v0.0.1
  admin: 01community/01cloud-admin:v0.0.1
  api: 01community/01cloud-api:v0.0.1
  core: 01community/01cloud-core:v0.0.1
  ci: 01community/01cloud-tekton-ci:v0.0.1
  provision: 01community/01cloud-tekton-provision:v0.0.1
  payment: 01community/01cloud-payments:v0.0.1
  support: 01community/01cloud-support:v0.0.1
  notification: 01community/01cloud-notification:v0.0.1
  monitoring: 01community/01cloud-monitoring:v0.0.1
  backup: 01community/01cloud-backup:v0.0.1
  exsecret: 01community/01cloud-exsecret:v0.0.1

secret:
  API_SECRET: --- YOUR-API-SECRET ---
  DB_PASSWORD: --- YOUR-DB-PASSWORD ---
  SMTP_PASSWORD: --- YOUR-SMTP-PASSWORD ---
  DB_URL: --- YOUR-DB-URL ---
