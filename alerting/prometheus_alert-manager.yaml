apiVersion: v1
data:
  alertmanager.yml: |
    global: {}
    receivers:
      - name: 'calert'
        webhook_configs:
                - url: 'http://gchat-alertmanager-gchat-integration:80/alerts?room=01cloudAlerts'
    route:
      group_interval: 60s
      group_wait: 30s
      receiver: 'calert'
      repeat_interval: 10s
      routes:
        - match:
            severity: critical
          receiver: calert
          group_by: ['KubernetesNodeReady']
    templates:
    - /etc/alertmanager/*.tmpl
kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: prometheus
    meta.helm.sh/release-namespace: monitoring
