apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-job
spec:
  schedule: "3 */3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: zeronecloud/gsutil:v1.0.0
            command: ["sh", "-c"]
            args:
            - |
              export PGPASSWORD="$(cat /data/DB_PASS)"
              cp data/.boto /root/
              filepath=$(date +'%Y/%m/%d')
              filename=$(date +'cloud-db_%H-%M-%S.gz')
              pg_dump -U berrybytes -h postgres cloud | gzip > $filename
              gsutil cp $filename gs://zerone-backup-dev/$filepath/$filename
            volumeMounts:
            - name: backup-secret
              mountPath: /data
              readOnly: true
          volumes:
          - name: backup-secret
            secret:
              secretName: backup-secret
          restartPolicy: OnFailure
---

