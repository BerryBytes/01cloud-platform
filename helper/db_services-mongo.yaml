apiVersion: v1
items:
- apiVersion: v1
  data:
    ping-mongodb.sh: |
      #!/bin/bash
      mongosh  $TLS_OPTIONS --port $MONGODB_PORT_NUMBER --eval "db.adminCommand('ping')"
    readiness-probe.sh: |
      #!/bin/bash
      # Run the proper check depending on the version
      [[ $(mongod -version | grep "db version") =~ ([0-9]+\.[0-9]+\.[0-9]+) ]] && VERSION=${BASH_REMATCH[1]}
      . /opt/bitnami/scripts/libversion.sh
      VERSION_MAJOR="$(get_sematic_version "$VERSION" 1)"
      VERSION_MINOR="$(get_sematic_version "$VERSION" 2)"
      VERSION_PATCH="$(get_sematic_version "$VERSION" 3)"
      if [[ ( "$VERSION_MAJOR" -ge 5 ) || ( "$VERSION_MAJOR" -ge 4 && "$VERSION_MINOR" -ge 4 && "$VERSION_PATCH" -ge 2 ) ]]; then
          mongosh $TLS_OPTIONS --port $MONGODB_PORT_NUMBER --eval 'db.hello().isWritablePrimary || db.hello().secondary' | grep 'true'
      else
          mongosh  $TLS_OPTIONS --port $MONGODB_PORT_NUMBER --eval 'db.isMaster().ismaster || db.isMaster().secondary' | grep 'true'
      fi
    startup-probe.sh: |
      #!/bin/bash
      mongosh  $TLS_OPTIONS --port $MONGODB_PORT_NUMBER --eval 'db.hello().isWritablePrimary || db.hello().secondary' | grep 'true'
  kind: ConfigMap
  metadata:
    annotations:
      meta.helm.sh/release-name: mongodb
    labels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: mongodb
      helm.sh/chart: mongodb-13.4.4
    name: mongodb-common-scripts
- apiVersion: v1
  data:
    setup-hidden.sh: |-
      #!/bin/bash

      . /opt/bitnami/scripts/mongodb-env.sh

      echo "Advertised Hostname: $MONGODB_ADVERTISED_HOSTNAME"
      echo "Advertised Port: $MONGODB_ADVERTISED_PORT_NUMBER"
      echo "Configuring node as a hidden node"
      export MONGODB_REPLICA_SET_MODE="hidden"
      export MONGODB_INITIAL_PRIMARY_ROOT_USER="$MONGODB_ROOT_USER"
      export MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD="$MONGODB_ROOT_PASSWORD"
      export MONGODB_INITIAL_PRIMARY_PORT_NUMBER="$MONGODB_PORT_NUMBER"
      export MONGODB_ROOT_PASSWORD=""
      export MONGODB_EXTRA_USERNAMES=""
      export MONGODB_EXTRA_DATABASES=""
      export MONGODB_EXTRA_PASSWORDS=""
      export MONGODB_ROOT_PASSWORD_FILE=""
      export MONGODB_EXTRA_USERNAMES_FILE=""
      export MONGODB_EXTRA_DATABASES_FILE=""
      export MONGODB_EXTRA_PASSWORDS_FILE=""
      exec /opt/bitnami/scripts/mongodb/entrypoint.sh /opt/bitnami/scripts/mongodb/run.sh
    setup.sh: |-
      #!/bin/bash

      . /opt/bitnami/scripts/mongodb-env.sh
      . /opt/bitnami/scripts/libfs.sh
      . /opt/bitnami/scripts/liblog.sh
      . /opt/bitnami/scripts/libvalidations.sh

      if is_empty_value "$MONGODB_ADVERTISED_PORT_NUMBER"; then
        export MONGODB_ADVERTISED_PORT_NUMBER="$MONGODB_PORT_NUMBER"
      fi

      info "Advertised Hostname: $MONGODB_ADVERTISED_HOSTNAME"
      info "Advertised Port: $MONGODB_ADVERTISED_PORT_NUMBER"

      # Check for existing replica set in case there is no data in the PVC
      # This is for cases where the PVC is lost or for MongoDB caches without
      # persistence
      current_primary=""
      if is_dir_empty "${MONGODB_DATA_DIR}/db"; then
        info "Data dir empty, checking if the replica set already exists"
        current_primary=$(mongosh admin --host "mongodb-0.mongodb-headless.default.svc.cluster.local:27017,mongodb-1.mongodb-headless.default.svc.cluster.local:27017,mongodb-2.mongodb-headless.default.svc.cluster.local:27017" --authenticationDatabase admin -u root -p $MONGODB_ROOT_PASSWORD --eval 'db.runCommand("ismaster")' | awk -F\' '/primary/ {print $2}')

        if ! is_empty_value "$current_primary"; then
          info "Detected existing primary: ${current_primary}"
        fi
      fi

      if ! is_empty_value "$current_primary" && [[ "$MONGODB_ADVERTISED_HOSTNAME:$MONGODB_ADVERTISED_PORT_NUMBER" == "$current_primary" ]]; then
          info "Advertised name matches current primary, configuring node as a primary"
          export MONGODB_REPLICA_SET_MODE="primary"
      elif ! is_empty_value "$current_primary" && [[ "$MONGODB_ADVERTISED_HOSTNAME:$MONGODB_ADVERTISED_PORT_NUMBER" != "$current_primary" ]]; then
          info "Current primary is different from this node. Configuring the node as replica of ${current_primary}"
          export MONGODB_REPLICA_SET_MODE="secondary"
          export MONGODB_INITIAL_PRIMARY_HOST="${current_primary%:*}"
          export MONGODB_INITIAL_PRIMARY_PORT_NUMBER="${current_primary#*:}"
          export MONGODB_SET_SECONDARY_OK="yes"
      elif [[ "$MY_POD_NAME" = "mongodb-0" ]]; then
          info "Pod name matches initial primary pod name, configuring node as a primary"
          export MONGODB_REPLICA_SET_MODE="primary"
      else
          info "Pod name doesn't match initial primary pod name, configuring node as a secondary"
          export MONGODB_REPLICA_SET_MODE="secondary"
          export MONGODB_INITIAL_PRIMARY_PORT_NUMBER="$MONGODB_PORT_NUMBER"
      fi

      if [[ "$MONGODB_REPLICA_SET_MODE" == "secondary" ]]; then
          export MONGODB_INITIAL_PRIMARY_ROOT_USER="$MONGODB_ROOT_USER"
          export MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD="$MONGODB_ROOT_PASSWORD"
          export MONGODB_ROOT_PASSWORD=""
          export MONGODB_EXTRA_USERNAMES=""
          export MONGODB_EXTRA_DATABASES=""
          export MONGODB_EXTRA_PASSWORDS=""
          export MONGODB_ROOT_PASSWORD_FILE=""
          export MONGODB_EXTRA_USERNAMES_FILE=""
          export MONGODB_EXTRA_DATABASES_FILE=""
          export MONGODB_EXTRA_PASSWORDS_FILE=""
      fi

      exec /opt/bitnami/scripts/mongodb/entrypoint.sh /opt/bitnami/scripts/mongodb/run.sh
  kind: ConfigMap
  metadata:
    annotations:
      meta.helm.sh/release-name: mongodb
    labels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: mongodb
      helm.sh/chart: mongodb-13.4.4
    name: mongodb-scripts
- apiVersion: apps/v1
  kind: StatefulSet
  metadata:
    annotations:
      meta.helm.sh/release-name: mongodb
    labels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: mongodb
      helm.sh/chart: mongodb-13.4.4
    name: mongodb
  spec:
    podManagementPolicy: OrderedReady
    replicas: 3
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app.kubernetes.io/component: mongodb
        app.kubernetes.io/instance: mongodb
        app.kubernetes.io/name: mongodb
    serviceName: mongodb-headless
    template:
      metadata:
        creationTimestamp: null
        labels:
          app.kubernetes.io/component: mongodb
          app.kubernetes.io/instance: mongodb
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: mongodb
          helm.sh/chart: mongodb-13.4.4
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: mongodb
                    app.kubernetes.io/instance: mongodb
                    app.kubernetes.io/name: mongodb
                topologyKey: kubernetes.io/hostname
              weight: 1
        containers:
        - command:
          - /scripts/setup.sh
          env:
          - name: BITNAMI_DEBUG
            value: "false"
          - name: MY_POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: MY_POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: MY_POD_HOST_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.hostIP
          - name: K8S_SERVICE_NAME
            value: mongodb-headless
          - name: MONGODB_INITIAL_PRIMARY_HOST
            value: mongodb-0.$(K8S_SERVICE_NAME).$(MY_POD_NAMESPACE).svc.cluster.local
          - name: MONGODB_REPLICA_SET_NAME
            value: rs0
          - name: MONGODB_ROOT_USER
            value: root
          - name: MONGODB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                key: mongodb-root-password
                name: mongodb
          - name: MONGODB_REPLICA_SET_KEY
            valueFrom:
              secretKeyRef:
                key: mongodb-replica-set-key
                name: mongodb
          - name: ALLOW_EMPTY_PASSWORD
            value: "no"
          - name: MONGODB_SYSTEM_LOG_VERBOSITY
            value: "0"
          - name: MONGODB_DISABLE_SYSTEM_LOG
            value: "no"
          - name: MONGODB_DISABLE_JAVASCRIPT
            value: "no"
          - name: MONGODB_ENABLE_JOURNAL
            value: "yes"
          - name: MONGODB_PORT_NUMBER
            value: "27017"
          - name: MONGODB_ENABLE_IPV6
            value: "no"
          - name: MONGODB_ENABLE_DIRECTORY_PER_DB
            value: "no"
          image: docker.io/bitnamilegacy/mongodb:6.0.3-debian-11-r0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
              - /bitnami/scripts/ping-mongodb.sh
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 10
          name: mongodb
          ports:
          - containerPort: 27017
            name: mongodb
            protocol: TCP
          readinessProbe:
            exec:
              command:
              - /bitnami/scripts/readiness-probe.sh
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /bitnami/mongodb
            name: datadir
          - mountPath: /bitnami/scripts
            name: common-scripts
          - mountPath: /scripts/setup.sh
            name: scripts
            subPath: setup.sh
        dnsPolicy: ClusterFirst
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext:
          fsGroup: 1001
        terminationGracePeriodSeconds: 30
        volumes:
        - configMap:
            defaultMode: 360
            name: mongodb-common-scripts
          name: common-scripts
        - configMap:
            defaultMode: 493
            name: mongodb-scripts
          name: scripts
    updateStrategy:
      type: RollingUpdate
    volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        creationTimestamp: null
        name: datadir
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
        volumeMode: Filesystem
      status:
        phase: Pending
- apiVersion: v1
  data:
    mongodb-replica-set-key: OU5KcjZWQXFZbg==
    mongodb-root-password: eHBMZU1mU282Yg==
  kind: Secret
  metadata:
    name: mongodb
  type: Opaque
- apiVersion: v1
  kind: Service
  metadata:
    annotations:
      meta.helm.sh/release-name: mongodb
    labels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: mongodb
      helm.sh/chart: mongodb-13.4.4
    name: mongodb-0
  spec:
    ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
    selector:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/name: mongodb
      statefulset.kubernetes.io/pod-name: mongodb-0
- apiVersion: v1
  kind: Service
  metadata:
    annotations:
      meta.helm.sh/release-name: mongodb
    labels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: mongodb
      helm.sh/chart: mongodb-13.4.4
    name: mongodb-1
  spec:
    ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
    selector:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/name: mongodb
      statefulset.kubernetes.io/pod-name: mongodb-1
- apiVersion: v1
  kind: Service
  metadata:
    annotations:
      meta.helm.sh/release-name: mongodb
    labels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: mongodb
      helm.sh/chart: mongodb-13.4.4
    name: mongodb-2
  spec:
    ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
    selector:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/name: mongodb
      statefulset.kubernetes.io/pod-name: mongodb-2
kind: List
